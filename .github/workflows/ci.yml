name: Publish Products to STAGING fiware-ops.github.io
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh-assets:
    name: Refresh Assets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Compress Images
      uses: calibreapp/image-actions@main
      continue-on-error: true
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        compressOnly: true
        ignorePaths: 'directories/**'
    - name: Check assets
      continue-on-error: true
      run: |
         $(rm -rf directories) || true
         $(cp -r ./assets/directories ./directories) || true
    - name: Upload assets via SCP
      env:
        SSHPASS: ${{ secrets.PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -e scp -o StrictHostKeyChecking=no \
          -o PreferredAuthentications=password \
          -P "${{ secrets.PORT }}" \
          -r directories/. \
          "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_DIR }}/directories/"

  refresh-page-data:
    name: Refresh Staging Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
       path: main
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: staging
        ref: gh-pages
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo
    - name: Create local changes
      run: |
        cp -R main/showcase staging
        cp -R main/marketplace staging
        cp -R main/directories staging
    - name: Commit files
      continue-on-error: true
      run: |
        cd staging
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A *
        git commit -m "Update Staging" -a
    - name: Push changes
      uses: ad-m/github-push-action@master
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        directory: staging
