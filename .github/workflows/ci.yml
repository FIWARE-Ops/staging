name: Publish Products to STAGING fiware-ops.github.io
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh-assets:
    name: Refresh Assets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compress Images
      uses: calibreapp/image-actions@main
      continue-on-error: true
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        compressOnly: true
        ignorePaths: 'directories/**'

    - name: Prepare assets
      run: |
        rm -rf upload
        mkdir -p upload
        cp -r assets/directories/. upload/
        echo "Files to upload:"
        find upload -type f

    - name: Upload assets via SCP
      env:
        SSHPASS: ${{ secrets.PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -e scp -o StrictHostKeyChecking=no \
          -o PreferredAuthentications=password \
          -P "${{ secrets.PORT }}" \
          -r upload/. \
          "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_DIR }}/directories/"

  refresh-page-data:
    name: Refresh Staging Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: main

    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: staging
        ref: gh-pages
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

    - name: Create local changes
      run: |
        cp -R main/showcase staging
        cp -R main/marketplace staging
        cp -R main/directories staging

    - name: Commit files
      id: commit
      run: |
        cd staging
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Update Staging"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        directory: staging
