name: Publish PEOPLE pages to LIVE fiware.org

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: copy file via sftp
        uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          uploads: |
            directories/people/ => ${{ secrets.SSH_DIR }}/directories/people/
