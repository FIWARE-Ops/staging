name: Publish PEOPLE pages to LIVE fiware.org

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      
      - name: copy file via ssh password (scp, not sftp subsystem)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          target: ${{ secrets.SSH_DIR }}
          source: "directories/people/**"
          strip_components: 2
          tar_tmp_path: /tmp
          debug: true
