name: Publish PEOPLE pages to LIVE fiware.org

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: upload via lftp (ftps, handles vsftpd TLS session reuse)
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USERNAME }}
          FTP_PASS: ${{ secrets.PASSWORD }}
          FTP_DIR: ${{ secrets.SSH_DIR }}
        run: |
          lftp -d -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u \"$FTP_USER,$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --verbose directories/people/ \"$FTP_DIR\";
            bye
          "
