name: Publish PEOPLE pages to LIVE fiware.org

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: upload via lftp (ftps, handles vsftpd TLS session reuse)
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USERNAME }}
          FTP_PASS: ${{ secrets.PASSWORD }}
          FTP_DIR: ${{ secrets.SSH_DIR }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            mirror -R --verbose directories/people/ \"\$FTP_DIR\";
            bye
          " "$FTP_HOST"
